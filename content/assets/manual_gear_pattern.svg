<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">手动挡 H 挡位示意</title>
  <desc id="desc">展示 1 到 5 挡与倒挡 R 的典型 H 型手动挡位布局，并标出低挡和高挡的用途。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="70" y="86" fill="#f8fafc" font-size="40" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">手动挡 H 挡位示意</text>
  <text x="70" y="128" fill="#cbd5e1" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">低挡位更有劲，适合起步和爬坡；高挡位更适合巡航和压低转速</text>

  <g transform="translate(145 190)" stroke-linecap="round" filter="url(#shadow)">
    <path d="M120 40V340M360 40V340M600 40V340M120 190H600" stroke="#475569" stroke-width="18"/>
    <path d="M120 40V340M360 40V340M600 40V340M120 190H600" stroke="url(#accent)" stroke-width="8"/>

    <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
      <g>
        <circle cx="120" cy="40" r="54" fill="#0b1220" stroke="#7dd3fc" stroke-width="4"/>
        <text x="120" y="53" fill="#f8fafc" font-size="44" font-weight="700">1</text>
      </g>
      <g>
        <circle cx="120" cy="340" r="54" fill="#0b1220" stroke="#7dd3fc" stroke-width="4"/>
        <text x="120" y="353" fill="#f8fafc" font-size="44" font-weight="700">2</text>
      </g>
      <g>
        <circle cx="360" cy="40" r="54" fill="#0b1220" stroke="#93c5fd" stroke-width="4"/>
        <text x="360" y="53" fill="#f8fafc" font-size="44" font-weight="700">3</text>
      </g>
      <g>
        <circle cx="360" cy="340" r="54" fill="#0b1220" stroke="#93c5fd" stroke-width="4"/>
        <text x="360" y="353" fill="#f8fafc" font-size="44" font-weight="700">4</text>
      </g>
      <g>
        <circle cx="600" cy="40" r="54" fill="#0b1220" stroke="#c4b5fd" stroke-width="4"/>
        <text x="600" y="53" fill="#f8fafc" font-size="44" font-weight="700">5</text>
      </g>
      <g>
        <circle cx="600" cy="340" r="54" fill="#2a1a1a" stroke="#fda4af" stroke-width="4"/>
        <text x="600" y="354" fill="#fff1f2" font-size="38" font-weight="700">R</text>
      </g>
    </g>
  </g>

  <g transform="translate(820 200)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="300" height="115" rx="24" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="28" y="42" fill="#f8fafc" font-size="26" font-weight="700">低挡位</text>
    <text x="28" y="74" fill="#cbd5e1" font-size="19">1 挡、2 挡为主</text>
    <text x="28" y="100" fill="#cbd5e1" font-size="19">起步、陡坡、低速挪车</text>

    <rect x="0" y="145" width="300" height="115" rx="24" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="28" y="187" fill="#f8fafc" font-size="26" font-weight="700">中间挡位</text>
    <text x="28" y="219" fill="#cbd5e1" font-size="19">3 挡、4 挡为主</text>
    <text x="28" y="245" fill="#cbd5e1" font-size="19">城市道路和中速巡航</text>

    <rect x="0" y="290" width="300" height="115" rx="24" fill="#0b1220" stroke="#7dd3fc" stroke-width="2"/>
    <text x="28" y="332" fill="#f8fafc" font-size="26" font-weight="700">高挡位</text>
    <text x="28" y="364" fill="#cbd5e1" font-size="19">5 挡 / 6 挡</text>
    <text x="28" y="390" fill="#cbd5e1" font-size="19">高速巡航、压低转速</text>
  </g>

  <g transform="translate(70 620)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="1060" height="88" rx="22" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="26" y="38" fill="#f8fafc" font-size="24" font-weight="700">记忆重点</text>
    <text x="26" y="68" fill="#cbd5e1" font-size="20">手动挡不是随意换挡，而是让车速、挡位、发动机转速彼此匹配。高速强行降到低挡，容易顿挫甚至伤车。</text>
  </g>
</svg>
