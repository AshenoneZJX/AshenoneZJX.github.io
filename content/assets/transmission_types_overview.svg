<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">常见变速箱对比</title>
  <desc id="desc">对比 MT、AT、CVT、DCT 的换挡特点、优势与常见感受。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>
  <text x="60" y="82" fill="#f8fafc" font-size="42" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">常见变速箱与挡位体验对比</text>
  <text x="60" y="122" fill="#cbd5e1" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">相同的 P、R、N、D 外观下，换挡逻辑和驾驶感受可能完全不同</text>

  <g transform="translate(50 180)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g>
      <rect x="0" y="0" width="280" height="560" rx="26" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
      <text x="28" y="52" fill="#f8fafc" font-size="34" font-weight="700">MT</text>
      <text x="28" y="84" fill="#7dd3fc" font-size="20">手动变速箱</text>
      <text x="28" y="134" fill="#e2e8f0" font-size="22" font-weight="700">特点</text>
      <text x="28" y="170" fill="#cbd5e1" font-size="19">• 驾驶员自己踩离合、换挡</text>
      <text x="28" y="202" fill="#cbd5e1" font-size="19">• 机械感最强，参与度高</text>
      <text x="28" y="248" fill="#e2e8f0" font-size="22" font-weight="700">优点</text>
      <text x="28" y="284" fill="#cbd5e1" font-size="19">• 传动效率高</text>
      <text x="28" y="316" fill="#cbd5e1" font-size="19">• 结构相对简单</text>
      <text x="28" y="348" fill="#cbd5e1" font-size="19">• 能精细控制挡位</text>
      <text x="28" y="394" fill="#e2e8f0" font-size="22" font-weight="700">常见感受</text>
      <text x="28" y="430" fill="#cbd5e1" font-size="19">• 开着有参与感</text>
      <text x="28" y="462" fill="#cbd5e1" font-size="19">• 堵车更累</text>
      <text x="28" y="494" fill="#cbd5e1" font-size="19">• 新手易熄火</text>
    </g>

    <g transform="translate(300 0)">
      <rect x="0" y="0" width="280" height="560" rx="26" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
      <text x="28" y="52" fill="#f8fafc" font-size="34" font-weight="700">AT</text>
      <text x="28" y="84" fill="#67e8f9" font-size="20">液力自动变速箱</text>
      <text x="28" y="134" fill="#e2e8f0" font-size="22" font-weight="700">特点</text>
      <text x="28" y="170" fill="#cbd5e1" font-size="19">• 自动决定升降挡</text>
      <text x="28" y="202" fill="#cbd5e1" font-size="19">• 低速跟车通常更平顺</text>
      <text x="28" y="248" fill="#e2e8f0" font-size="22" font-weight="700">优点</text>
      <text x="28" y="284" fill="#cbd5e1" font-size="19">• 新手友好</text>
      <text x="28" y="316" fill="#cbd5e1" font-size="19">• 起步、挪车顺滑</text>
      <text x="28" y="348" fill="#cbd5e1" font-size="19">• 适应面广</text>
      <text x="28" y="394" fill="#e2e8f0" font-size="22" font-weight="700">常见感受</text>
      <text x="28" y="430" fill="#cbd5e1" font-size="19">• 最省心</text>
      <text x="28" y="462" fill="#cbd5e1" font-size="19">• 家用车体验稳定</text>
      <text x="28" y="494" fill="#cbd5e1" font-size="19">• 换挡感觉通常不突兀</text>
    </g>

    <g transform="translate(600 0)">
      <rect x="0" y="0" width="280" height="560" rx="26" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
      <text x="28" y="52" fill="#f8fafc" font-size="34" font-weight="700">CVT</text>
      <text x="28" y="84" fill="#c4b5fd" font-size="20">无级变速箱</text>
      <text x="28" y="134" fill="#e2e8f0" font-size="22" font-weight="700">特点</text>
      <text x="28" y="170" fill="#cbd5e1" font-size="19">• 没有固定物理挡位</text>
      <text x="28" y="202" fill="#cbd5e1" font-size="19">• 传动比连续变化</text>
      <text x="28" y="248" fill="#e2e8f0" font-size="22" font-weight="700">优点</text>
      <text x="28" y="284" fill="#cbd5e1" font-size="19">• 日常最平顺之一</text>
      <text x="28" y="316" fill="#cbd5e1" font-size="19">• 城市通勤舒适</text>
      <text x="28" y="348" fill="#cbd5e1" font-size="19">• 油门响应连贯</text>
      <text x="28" y="394" fill="#e2e8f0" font-size="22" font-weight="700">常见感受</text>
      <text x="28" y="430" fill="#cbd5e1" font-size="19">• 很顺</text>
      <text x="28" y="462" fill="#cbd5e1" font-size="19">• 急加速时可能有“橡皮筋感”</text>
      <text x="28" y="494" fill="#cbd5e1" font-size="19">• 不强调强烈换挡顿挫</text>
    </g>

    <g transform="translate(900 0)">
      <rect x="0" y="0" width="280" height="560" rx="26" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
      <text x="28" y="52" fill="#f8fafc" font-size="34" font-weight="700">DCT</text>
      <text x="28" y="84" fill="#6ee7b7" font-size="20">双离合变速箱</text>
      <text x="28" y="134" fill="#e2e8f0" font-size="22" font-weight="700">特点</text>
      <text x="28" y="170" fill="#cbd5e1" font-size="19">• 两套离合器提前预选挡位</text>
      <text x="28" y="202" fill="#cbd5e1" font-size="19">• 换挡快，动力衔接直接</text>
      <text x="28" y="248" fill="#e2e8f0" font-size="22" font-weight="700">优点</text>
      <text x="28" y="284" fill="#cbd5e1" font-size="19">• 传动效率高</text>
      <text x="28" y="316" fill="#cbd5e1" font-size="19">• 加速响应利落</text>
      <text x="28" y="348" fill="#cbd5e1" font-size="19">• 运动感更强</text>
      <text x="28" y="394" fill="#e2e8f0" font-size="22" font-weight="700">常见感受</text>
      <text x="28" y="430" fill="#cbd5e1" font-size="19">• 换挡快</text>
      <text x="28" y="462" fill="#cbd5e1" font-size="19">• 低速蠕行可能更顿</text>
      <text x="28" y="494" fill="#cbd5e1" font-size="19">• 拥堵路况体验更挑标定</text>
    </g>
  </g>

  <g transform="translate(60 780)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="1160" height="48" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="22" y="32" fill="#cbd5e1" font-size="19">结论：AT 最省心，CVT 最顺，DCT 最快，MT 最需要驾驶参与。看到相同档位字母，不代表体验完全一样。</text>
  </g>
</svg>
