<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">自动挡常见档位示意</title>
  <desc id="desc">展示自动挡常见的 P、R、N、D、S、L、M 档位及它们各自的主要用途。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <text x="60" y="84" fill="#f9fafb" font-size="40" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">自动挡常见档位示意</text>
  <text x="60" y="124" fill="#cbd5e1" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">字母看起来不多，但核心在于理解“停车、倒车、空挡、日常前进、强化动力、低挡控制”六种状态</text>

  <g transform="translate(70 190)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="1060" height="90" rx="24" fill="#0b1220" stroke="#374151" stroke-width="2"/>
    <g text-anchor="middle">
      <g transform="translate(66 45)">
        <circle r="34" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
        <text y="12" fill="#fff7ed" font-size="34" font-weight="700">P</text>
      </g>
      <g transform="translate(236 45)">
        <circle r="34" fill="#1f2937" stroke="#fb7185" stroke-width="3"/>
        <text y="12" fill="#fff1f2" font-size="34" font-weight="700">R</text>
      </g>
      <g transform="translate(406 45)">
        <circle r="34" fill="#1f2937" stroke="#cbd5e1" stroke-width="3"/>
        <text y="12" fill="#f8fafc" font-size="34" font-weight="700">N</text>
      </g>
      <g transform="translate(576 45)">
        <circle r="34" fill="#1f2937" stroke="#22d3ee" stroke-width="3"/>
        <text y="12" fill="#ecfeff" font-size="34" font-weight="700">D</text>
      </g>
      <g transform="translate(746 45)">
        <circle r="34" fill="#1f2937" stroke="#8b5cf6" stroke-width="3"/>
        <text y="12" fill="#f5f3ff" font-size="34" font-weight="700">S</text>
      </g>
      <g transform="translate(916 45)">
        <circle r="34" fill="#1f2937" stroke="#34d399" stroke-width="3"/>
        <text y="12" fill="#ecfdf5" font-size="34" font-weight="700">L</text>
      </g>
      <g transform="translate(1020 45)">
        <circle r="34" fill="#1f2937" stroke="#93c5fd" stroke-width="3"/>
        <text y="12" fill="#eff6ff" font-size="30" font-weight="700">M</text>
      </g>
    </g>
  </g>

  <g transform="translate(70 330)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(0 0)">
      <rect width="320" height="122" rx="22" fill="#0b1220" stroke="#f59e0b" stroke-width="2"/>
      <text x="24" y="40" fill="#f9fafb" font-size="28" font-weight="700">P 挡</text>
      <text x="24" y="74" fill="#d1d5db" font-size="20">驻车锁止</text>
      <text x="24" y="102" fill="#d1d5db" font-size="18">停车熄火时使用，建议配合手刹</text>
    </g>
    <g transform="translate(370 0)">
      <rect width="320" height="122" rx="22" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
      <text x="24" y="40" fill="#f9fafb" font-size="28" font-weight="700">R 挡</text>
      <text x="24" y="74" fill="#d1d5db" font-size="20">倒车</text>
      <text x="24" y="102" fill="#d1d5db" font-size="18">车辆停稳后再挂入，避免冲击变速箱</text>
    </g>
    <g transform="translate(740 0)">
      <rect width="320" height="122" rx="22" fill="#0b1220" stroke="#cbd5e1" stroke-width="2"/>
      <text x="24" y="40" fill="#f9fafb" font-size="28" font-weight="700">N 挡</text>
      <text x="24" y="74" fill="#d1d5db" font-size="20">空挡</text>
      <text x="24" y="102" fill="#d1d5db" font-size="18">切断驱动力，不适合长下坡滑行</text>
    </g>

    <g transform="translate(0 162)">
      <rect width="320" height="122" rx="22" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
      <text x="24" y="40" fill="#f9fafb" font-size="28" font-weight="700">D 挡</text>
      <text x="24" y="74" fill="#d1d5db" font-size="20">日常前进</text>
      <text x="24" y="102" fill="#d1d5db" font-size="18">城市通勤、普通路况几乎都在这里完成</text>
    </g>
    <g transform="translate(370 162)">
      <rect width="320" height="122" rx="22" fill="#0b1220" stroke="#8b5cf6" stroke-width="2"/>
      <text x="24" y="40" fill="#f9fafb" font-size="28" font-weight="700">S 挡</text>
      <text x="24" y="74" fill="#d1d5db" font-size="20">运动模式</text>
      <text x="24" y="102" fill="#d1d5db" font-size="18">延迟升挡、积极降挡，超车更直接</text>
    </g>
    <g transform="translate(740 162)">
      <rect width="320" height="122" rx="22" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
      <text x="24" y="40" fill="#f9fafb" font-size="28" font-weight="700">L / M 挡</text>
      <text x="24" y="74" fill="#d1d5db" font-size="20">低挡 / 手动模式</text>
      <text x="24" y="102" fill="#d1d5db" font-size="18">坡道、长下坡、重载、主动控挡</text>
    </g>
  </g>

  <g transform="translate(70 684)" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="1060" height="84" rx="20" fill="#0b1220" stroke="url(#main)" stroke-width="2"/>
    <text x="24" y="36" fill="#f9fafb" font-size="24" font-weight="700">最小记忆模型</text>
    <text x="24" y="64" fill="#d1d5db" font-size="19">P 停车，R 倒车，N 空挡，D 日常前进，S 更激进，L 更低挡，M 主动控制升降挡。</text>
  </g>
</svg>
